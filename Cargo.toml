[package]
name = "p59-dioxus-short-url"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"

# 서버 빌드에서만 쓰는 의존성 (wasm 번들에는 들어가지 않는다)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
anyhow = { version = "1", optional = true }
dioxus-ssr = { version = "0.7.10", optional = true }
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
] }

[features]
default = []
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:tokio",
    "dep:anyhow",
    "dep:dioxus-ssr",
    "dep:sqlx",
]

[profile.release]
opt-level = 3
lto = true

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
